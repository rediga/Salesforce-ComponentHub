<template>
    <lightning-card title={cardTitle} icon-name="standard:related_list">
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading related records" size="small"></lightning-spinner>
            </template>
            <template if:true={errorMessage}>
                <div class="slds-text-color_error" role="alert">{errorMessage}</div>
            </template>
            <template if:true={hasRecords}>
                <lightning-datatable
                    key-field="Id"
                    data={records}
                    columns={columns}
                    hide-checkbox-column
                    onrowaction={handleRowAction}>
                </lightning-datatable>
            </template>
            <template if:false={hasRecords}>
                <template if:false={isLoading}>
                    <template if:false={errorMessage}>
                        <p class="slds-text-color_weak">No related records found.</p>
                    </template>
                </template>
            </template>
            <template if:true={hasMore}>
                <div class="slds-m-top_small">
                    <lightning-button label="Load more" onclick={handleLoadMore}></lightning-button>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
